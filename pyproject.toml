[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pmf"
version = "0.1.0"
description = "MAP estimation and matrix completion with probabilistic matrix factorization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["pmf", "pmf.solvers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
